name: Build artifacts

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: build-artifacts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Rust crate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust 1.88
        shell: bash
        run: |
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup component add rustfmt clippy --toolchain 1.88.0

      - name: Run tests
        run: cargo +1.88.0 test --locked

      - name: Check formatting
        run: cargo +1.88.0 fmt -- --check

      - name: Run Clippy
        run: cargo +1.88.0 clippy --locked --all-targets -- -D warnings

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: immich-alt-text-x86_64-unknown-linux-musl
            platform: linux
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            artifact: immich-alt-text-aarch64-unknown-linux-musl
            platform: linux
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: immich-alt-text-aarch64-apple-darwin
            platform: macos

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust 1.88 and target
        shell: bash
        run: |
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup target add "${{ matrix.target }}" --toolchain 1.88.0

      - name: Install Zig
        if: matrix.platform == 'linux'
        uses: mlugg/setup-zig@v1
        with:
          version: 0.14.1

      - name: Install cargo-zigbuild
        if: matrix.platform == 'linux'
        run: cargo install --locked cargo-zigbuild

      - name: Build Linux musl binary
        if: matrix.platform == 'linux'
        run: cargo +1.88.0 zigbuild --locked --release --target "${{ matrix.target }}"

      - name: Build macOS ARM64 binary
        if: matrix.platform == 'macos'
        run: cargo +1.88.0 build --locked --release --target "${{ matrix.target }}"

      - name: Inspect binary
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/immich-alt-text"
          test -x "$binary"
          file "$binary"

      - name: Smoke test native binary
        if: matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-apple-darwin'
        shell: bash
        run: target/${{ matrix.target }}/release/immich-alt-text --help

      - name: Package target binary
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/immich-alt-text"
          archive="$RUNNER_TEMP/${{ matrix.artifact }}.tar.gz"
          tar -C "$(dirname "$binary")" -czf "$archive" "$(basename "$binary")"
          tar -tzf "$archive"

      - name: Upload target artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/${{ matrix.artifact }}.tar.gz
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  aggregate:
    name: Aggregate build artifacts
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download target artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: 'immich-alt-text-{x86_64-unknown-linux-musl,aarch64-unknown-linux-musl,aarch64-apple-darwin}'
          merge-multiple: true
          path: artifacts

      - name: Verify aggregate contents
        shell: bash
        run: |
          test "$(find artifacts -maxdepth 1 -type f -name '*.tar.gz' | wc -l)" -eq 3
          for archive in artifacts/*.tar.gz; do
            tar -tzf "$archive"
          done

      - name: Upload aggregate artifact
        uses: actions/upload-artifact@v4
        with:
          name: immich-alt-text-builds
          path: artifacts/*.tar.gz
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
