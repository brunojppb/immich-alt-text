name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (without the v prefix)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare v${{ inputs.version }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      previous_tag: ${{ steps.release.outputs.previous_tag }}
      commit_range: ${{ steps.release.outputs.commit_range }}
    steps:
      - name: Require the main branch
        shell: bash
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          if [[ "$RELEASE_REF" != "refs/heads/main" ]]; then
            echo "Releases must be dispatched from the main branch." >&2
            exit 1
          fi

      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup show active-toolchain

      - name: Create and push release commit and tag
        id: release
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          semver_re='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$'
          if [[ ! "$VERSION" =~ $semver_re ]]; then
            echo "Version must be valid SemVer in MAJOR.MINOR.PATCH form." >&2
            exit 1
          fi

          tag="v$VERSION"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            echo "Tag $tag already exists." >&2
            exit 1
          fi

          previous_tag="$(git describe --tags --abbrev=0 2>/dev/null || true)"

          perl -0pi -e 's/(\A\[package\][^\[]*?^version = ")[^"]+("\s*$)/$1$ENV{VERSION}$2/m' Cargo.toml
          if ! sed -n '/^\[package\]$/,/^\[/p' Cargo.toml | grep -Fqx "version = \"$VERSION\""; then
            echo "Failed to update the package version in Cargo.toml." >&2
            exit 1
          fi

          cargo check
          cargo check --locked

          if git diff --quiet -- Cargo.toml; then
            echo "Version $VERSION does not change Cargo.toml." >&2
            exit 1
          fi
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo did not regenerate Cargo.lock for version $VERSION." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "chore: release $tag"
          git tag --annotate "$tag" --message "Release $tag"

          if [[ -n "$previous_tag" ]]; then
            commit_range="$previous_tag..$tag"
          else
            commit_range="$tag"
          fi

          git push --atomic origin "HEAD:refs/heads/main" "refs/tags/$tag"

          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'previous_tag=%s\n' "$previous_tag" >> "$GITHUB_OUTPUT"
          printf 'commit_range=%s\n' "$commit_range" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            platform: linux
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            platform: linux
          - os: macos-14
            target: aarch64-apple-darwin
            platform: macos

    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - name: Install pinned Rust toolchain and target
        shell: bash
        run: |
          rustup show active-toolchain
          rustup target add "${{ matrix.target }}"

      - name: Install Zig
        if: matrix.platform == 'linux'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.1

      - name: Install cargo-zigbuild
        if: matrix.platform == 'linux'
        run: cargo install --locked cargo-zigbuild

      - name: Build Linux musl binary
        if: matrix.platform == 'linux'
        run: cargo zigbuild --locked --release --target "${{ matrix.target }}"

      - name: Build Apple Silicon binary
        if: matrix.platform == 'macos'
        run: cargo build --locked --release --target "${{ matrix.target }}"

      - name: Smoke test native binary
        if: matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-apple-darwin'
        shell: bash
        run: target/${{ matrix.target }}/release/immich-alt-text --help

      - name: Package binary and checksum
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          binary="target/$TARGET/release/immich-alt-text"
          archive="immich-alt-text-$TARGET.tar.gz"

          test -f "$binary"
          test -x "$binary"
          mkdir -p dist
          tar -C "$(dirname "$binary")" -czf "dist/$archive" "$(basename "$binary")"
          test "$(tar -tzf "dist/$archive")" = "immich-alt-text"
          (
            cd dist
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$archive" > "$archive.sha256"
            else
              shasum -a 256 "$archive" > "$archive.sha256"
            fi
          )

      - name: Upload immutable target artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: immich-alt-text-${{ matrix.target }}
          path: |
            dist/immich-alt-text-${{ matrix.target }}.tar.gz
            dist/immich-alt-text-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          overwrite: false

  release:
    name: Publish v${{ needs.prepare.outputs.version }}
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Check out release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download target artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: immich-alt-text-*
          merge-multiple: true
          path: dist

      - name: Verify release assets
        shell: bash
        run: |
          targets=(
            x86_64-unknown-linux-musl
            aarch64-unknown-linux-musl
            aarch64-apple-darwin
          )

          test "$(find dist -maxdepth 1 -type f -name '*.tar.gz' | wc -l)" -eq 3
          test "$(find dist -maxdepth 1 -type f -name '*.tar.gz.sha256' | wc -l)" -eq 3

          for target in "${targets[@]}"; do
            archive="immich-alt-text-$target.tar.gz"
            test -f "dist/$archive"
            test -f "dist/$archive.sha256"
            (
              cd dist
              sha256sum --check "$archive.sha256"
            )
            test "$(tar -tzf "dist/$archive")" = "immich-alt-text"
          done

          cat dist/*.tar.gz.sha256 | LC_ALL=C sort -k2 > dist/SHA256SUMS
          test "$(wc -l < dist/SHA256SUMS)" -eq 3

      - name: Generate release notes
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PREVIOUS_TAG: ${{ needs.prepare.outputs.previous_tag }}
          COMMIT_RANGE: ${{ needs.prepare.outputs.commit_range }}
        run: |
          release_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"

          {
            printf '# immich-alt-text %s\n\n' "$TAG"
            printf 'Version `%s` release binaries and checksums.\n\n' "$VERSION"
            printf '## Changes\n\n'
            if [[ -n "$PREVIOUS_TAG" ]]; then
              printf 'Changes since `%s`:\n\n' "$PREVIOUS_TAG"
            else
              printf 'Changes included in the first tagged release:\n\n'
            fi
            while IFS=$'\t' read -r sha short subject; do
              printf -- '- [`%s`](https://github.com/%s/commit/%s) %s\n' \
                "$short" "$GITHUB_REPOSITORY" "$sha" "$subject"
            done < <(git log --reverse --format='%H%x09%h%x09%s' "$COMMIT_RANGE")
            printf '\n## Downloads\n\n'
            printf '| Platform | Architecture | Target | Archive | Checksum |\n'
            printf '| --- | --- | --- | --- | --- |\n'
            printf '| Linux | x86-64 | `x86_64-unknown-linux-musl` | [Linux x86-64 archive](%s/immich-alt-text-x86_64-unknown-linux-musl.tar.gz) | [SHA-256](%s/immich-alt-text-x86_64-unknown-linux-musl.tar.gz.sha256) |\n' "$release_url" "$release_url"
            printf '| Linux | ARM64 | `aarch64-unknown-linux-musl` | [Linux ARM64 archive](%s/immich-alt-text-aarch64-unknown-linux-musl.tar.gz) | [SHA-256](%s/immich-alt-text-aarch64-unknown-linux-musl.tar.gz.sha256) |\n' "$release_url" "$release_url"
            printf '| macOS | Apple Silicon | `aarch64-apple-darwin` | [macOS Apple Silicon archive](%s/immich-alt-text-aarch64-apple-darwin.tar.gz) | [SHA-256](%s/immich-alt-text-aarch64-apple-darwin.tar.gz.sha256) |\n' "$release_url" "$release_url"
            printf '\nThe combined [SHA256SUMS](%s/SHA256SUMS) file is also attached for users who want to verify all archives at once.\n' "$release_url"
          } > release-notes.md

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          release_args=(
            "$TAG"
            dist/immich-alt-text-x86_64-unknown-linux-musl.tar.gz
            dist/immich-alt-text-x86_64-unknown-linux-musl.tar.gz.sha256
            dist/immich-alt-text-aarch64-unknown-linux-musl.tar.gz
            dist/immich-alt-text-aarch64-unknown-linux-musl.tar.gz.sha256
            dist/immich-alt-text-aarch64-apple-darwin.tar.gz
            dist/immich-alt-text-aarch64-apple-darwin.tar.gz.sha256
            dist/SHA256SUMS
            --verify-tag
            --title "immich-alt-text $TAG"
            --notes-file release-notes.md
          )
          version_without_build="${VERSION%%+*}"
          if [[ "$version_without_build" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "${release_args[@]}"
