name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust 1.88
        shell: bash
        run: |
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup component add rustfmt clippy --toolchain 1.88.0

      - name: Build
        run: cargo +1.88.0 build --locked

      - name: Test
        run: cargo +1.88.0 test --locked

      - name: Check formatting
        run: cargo +1.88.0 fmt -- --check

      - name: Run Clippy
        run: cargo +1.88.0 clippy --locked --all-targets -- -D warnings
